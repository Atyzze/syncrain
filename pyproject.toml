[build-system]
requires = ["setuptools>=77"]                 # license as an SPDX expression
build-backend = "setuptools.build_meta"

[project]
name = "syncrain"
# The packaging metadata field holds the build number, read from BUILD_NUMBER: one fact, one place.
dynamic = ["version"]
description = "Never-repeating, clock-synchronised code-rain live wallpaper (GTK4 + OpenGL; Wayland layer-shell and X11)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["PyGObject", "Pillow"]

[project.urls]
Homepage = "https://github.com/Atyzze/syncrain"
Documentation = "https://github.com/Atyzze/syncrain/blob/main/docs/OPERATIONS.md"

[project.scripts]
syncrain = "syncrain.app:main"

# The data folders (shaders, the lock screen's QML, the login screen's script) are namespace packages
# of their own to setuptools: found as such, rather than named by hand and warned about at every build.
[tool.setuptools.packages.find]
include = ["syncrain", "syncrain.*"]
namespaces = true

[tool.setuptools.dynamic]
version = { file = "BUILD_NUMBER" }

[tool.setuptools.package-data]
syncrain = ["data/*.png", "data/*.json", "data/shaders/*", "native/*.c", "native/*.h", "native/build.sh",
            "native/protocols/*.xml", "lockscreen/*.cpp", "lockscreen/*.h", "lockscreen/CMakeLists.txt",
            "lockscreen/package/metadata.json", "lockscreen/package/contents/lockscreen/*.qml",
            "lockscreen/package/contents/lockscreen/qmldir", "login/*.sh"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "--strict-markers -p no:cacheprovider"
testpaths = ["tests/unit", "tests/contract", "tests/native", "tests/render", "tests/wayland", "tests/kwin", "tests/browser",
             "tests/nix", "tests/lockscreen"]
pythonpath = ["."]
